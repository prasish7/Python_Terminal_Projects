<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Digital Clock preview</title>
  <desc id="desc">A fictional preview of the Python Digital Clock desktop application.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#202020"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="760" height="430" rx="16" fill="#d8d8d8"/>
  <rect x="12" y="12" width="736" height="406" rx="12" fill="url(#background)" stroke="#555" stroke-width="2"/>
  <text x="380" y="72" text-anchor="middle" fill="#bdbdbd" font-family="Segoe UI, sans-serif" font-size="24">Digital Clock</text>
  <rect x="70" y="112" width="620" height="190" rx="18" fill="#000" stroke="#777" stroke-width="3"/>
  <text x="380" y="245" text-anchor="middle" fill="#baffc5" filter="url(#glow)" font-family="Consolas, monospace" font-size="92" letter-spacing="4">08:37:14PM</text>
  <text x="380" y="360" text-anchor="middle" fill="#888" font-family="Segoe UI, sans-serif" font-size="18">PyQt5 desktop preview</text>
</svg>
